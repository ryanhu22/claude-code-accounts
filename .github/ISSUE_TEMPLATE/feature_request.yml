name: Feature request
description: Describe a problem the tool could help with.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the work and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: Describe the behavior you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried?
      description: Include any alternatives or workarounds.
