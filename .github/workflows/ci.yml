name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      # setup-uv already creates and activates .venv when given a python
      # version; --clear makes this step hold either way.
      - run: uv venv --clear
      - run: uv pip install -e ".[menubar]" pytest ruff
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync python -m compileall -q src
      - run: uv run --no-sync python -c "import claude_code_accounts.menubar, claude_code_accounts.gauge, claude_code_accounts.glyphs"
      - run: uv run --no-sync pytest
