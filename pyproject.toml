[project]
name = "claude-code-manager"
version = "0.1.0"
description = "Manage multiple Claude Code subscriptions: usage, per-project accounts, and a macOS menu bar app"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
menubar = ["rumps>=0.4.0"]

[project.scripts]
ccm = "claude_code_manager.cli:main"

[project.gui-scripts]
ccm-menubar = "claude_code_manager.menubar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_code_manager"]
